<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SummitFX Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0a0f1a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .dropdown-menu {
            display: none;
        }
        .dropdown-menu.show {
            display: block;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <a href="index.html" class="flex items-center gap-2">
            <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center font-bold text-slate-900">S</div>
            <span class="text-xl font-bold">Summit<span class="text-green-400">FX</span></span>
        </a>
        
        <div class="flex items-center gap-4">
            <div class="bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                <span class="text-slate-400 text-sm">Balance:</span>
                <span id="userBalance" class="text-white font-bold ml-2">$0.00</span>
            </div>
            
            <!-- Dropdown Menu -->
            <div class="relative">
                <button onclick="toggleDropdown()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg border border-slate-700 transition">
                    <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-slate-900 font-bold">
                        <span id="userInitial">U</span>
                    </div>
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                
                <!-- Dropdown Content -->
                <div id="dropdownMenu" class="dropdown-menu absolute right-0 mt-2 w-56 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50">
                    <div class="px-4 py-3 border-b border-slate-700">
                        <p class="text-sm text-slate-400">Signed in as</p>
                        <p id="userEmail" class="text-sm font-medium text-white truncate">user@example.com</p>
                    </div>
                    <div class="py-2">
                        <a href="#" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Profile
                        </a>
                        <a href="#" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            Trading Bots
                        </a>
                        <a href="#" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                            Investment Plans
                        </a>
                        <a href="#" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                            Deposit
                        </a>
                        <a href="#" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                            Withdraw
                        </a>
                        <a href="#" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                            Transactions
                        </a>
                    </div>
                    <div class="border-t border-slate-700 py-2">
                        <button onclick="handleLogout()" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-slate-700 transition flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row p-4 gap-4 max-w-[1600px] mx-auto w-full">
        
        <!-- Chart - BIGGER NOW -->
        <div class="flex-1 bg-slate-900 rounded-xl border border-slate-800 p-2 min-h-[600px] lg:min-h-[700px]">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                    "autosize": true,
                    "symbol": "BINANCE:BTCUSDT",
                    "interval": "1",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "enable_publishing": false,
                    "allow_symbol_change": true
                }
                </script>
            </div>
        </div>

        <!-- Trade Panel -->
        <div class="w-full lg:w-80 bg-slate-900 rounded-xl border border-slate-800 p-6 flex flex-col gap-5">
            <h3 class="text-xl font-bold text-center">Quick Trade</h3>
            
            <div>
                <label class="text-xs text-slate-400 uppercase">Asset</label>
                <div class="mt-2 bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white font-semibold">
                    EUR/USD <span class="text-green-400 text-sm float-right">85%</span>
                </div>
            </div>

            <div>
                <label class="text-xs text-slate-400 uppercase">Time</label>
                <div class="mt-2 grid grid-cols-3 gap-2">
                    <button class="time-btn bg-slate-800 border border-slate-700 py-2 rounded-lg text-white text-sm" data-time="60">1m</button>
                    <button class="time-btn bg-green-500/20 border border-green-500 py-2 rounded-lg text-green-400 font-bold text-sm" data-time="300">5m</button>
                    <button class="time-btn bg-slate-800 border border-slate-700 py-2 rounded-lg text-white text-sm" data-time="900">15m</button>
                </div>
            </div>

            <div>
                <label class="text-xs text-slate-400 uppercase">Amount ($)</label>
                <div class="mt-2 flex items-center bg-slate-800 border border-slate-700 rounded-lg">
                    <button onclick="changeAmount(-10)" class="px-4 py-3 text-white hover:bg-slate-700 font-bold">-</button>
                    <input type="number" id="tradeAmount" value="100" class="flex-1 bg-transparent text-center text-white font-bold text-lg focus:outline-none">
                    <button onclick="changeAmount(10)" class="px-4 py-3 text-white hover:bg-slate-700 font-bold">+</button>
                </div>
            </div>

            <div class="mt-auto grid grid-cols-2 gap-3 pt-4">
                <button onclick="executeTrade('UP')" class="py-4 bg-green-500 hover:bg-green-600 text-white font-bold text-lg rounded-xl transition">
                    ▲ UP
                </button>
                <button onclick="executeTrade('DOWN')" class="py-4 bg-red-500 hover:bg-red-600 text-white font-bold text-lg rounded-xl transition">
                    ▼ DOWN
                </button>
            </div>
        </div>
    </main>

    <!-- Trade History Section -->
    <section class="max-w-[1600px] mx-auto w-full px-4 pb-8">
        <h3 class="text-2xl font-bold mb-4">Recent Trades</h3>
        <div class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-800 text-slate-400 text-sm uppercase">
                    <tr>
                        <th class="px-6 py-3">Time</th>
                        <th class="px-6 py-3">Asset</th>
                        <th class="px-6 py-3">Type</th>
                        <th class="px-6 py-3">Amount</th>
                        <th class="px-6 py-3">Status</th>
                        <th class="px-6 py-3">Profit/Loss</th>
                    </tr>
                </thead>
                <tbody id="tradesTable" class="divide-y divide-slate-800">
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-slate-500">Loading trades...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <script>
        const SUPABASE_URL = 'https://lrfufnpfehdizzwvausy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyZnVmbnBmZWhkaXp6d3ZhdXN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MDAzNzksImV4cCI6MjA5ODM3NjM3OX0.UafAmnWeqkvWZQSGfQYnjYLkbtROVKj9yhLR4wPG5mI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let selectedTime = 300;

        // Dropdown toggle
        function toggleDropdown() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        // Close dropdown when clicking outside
        window.onclick = function(event) {
            if (!event.target.closest('button[onclick="toggleDropdown()"]')) {
                const dropdowns = document.getElementsByClassName('dropdown-menu');
                for (let dropdown of dropdowns) {
                    if (dropdown.classList.contains('show')) {
                        dropdown.classList.remove('show');
                    }
                }
            }
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'signin.html';
            } else {
                currentUser = session.user;
                document.getElementById('userEmail').textContent = currentUser.email;
                document.getElementById('userInitial').textContent = currentUser.email.charAt(0).toUpperCase();
                await fetchBalance();
                await loadTrades();
            }
        }

        async function fetchBalance() {
            const { data } = await supabaseClient
                .from('wallets')
                .select('balance')
                .eq('id', currentUser.id)
                .single();
            
            if (data) {
                document.getElementById('userBalance').textContent = 
                    `$${parseFloat(data.balance).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            }
        }

        async function executeTrade(direction) {
            const amount = parseFloat(document.getElementById('tradeAmount').value);
            
            const { data: wallet } = await supabaseClient
                .from('wallets')
                .select('balance')
                .eq('id', currentUser.id)
                .single();

            if (amount > wallet.balance) {
                showToast('Insufficient balance!', 'error');
                return;
            }

            const entryPrice = 1.0845;

            const newBalance = wallet.balance - amount;
            await supabaseClient
                .from('wallets')
                .update({ balance: newBalance })
                .eq('id', currentUser.id);

            const { error } = await supabaseClient
                .from('trades')
                .insert({
                    user_id: currentUser.id,
                    asset: 'EUR/USD',
                    amount: amount,
                    direction: direction,
                    entry_price: entryPrice,
                    duration_seconds: selectedTime,
                    payout_percentage: 85.00,
                    status: 'pending'
                });

            if (error) {
                showToast('Error placing trade', 'error');
                return;
            }

            showToast(`Trade placed: ${direction} $${amount}`, 'success');
            await fetchBalance();
            await loadTrades();

            setTimeout(() => completeTrade(direction, amount, entryPrice), selectedTime * 1000);
        }

        async function completeTrade(direction, amount, entryPrice) {
            const priceChange = (Math.random() - 0.5) * 0.0010;
            const exitPrice = entryPrice + priceChange;
            
            let won = false;
            if (direction === 'UP' && exitPrice > entryPrice) won = true;
            if (direction === 'DOWN' && exitPrice < entryPrice) won = true;

            const profit = won ? amount * 0.85 : -amount;
            const status = won ? 'won' : 'lost';

            await supabaseClient
                .from('trades')
                .update({
                    exit_price: exitPrice,
                    status: status,
                    profit: profit,
                    completed_at: new Date().toISOString()
                })
                .eq('user_id', currentUser.id)
                .eq('status', 'pending')
                .order('created_at', { ascending: false })
                .limit(1);

            if (won) {
                const { data: wallet } = await supabaseClient
                    .from('wallets')
                    .select('balance')
                    .eq('id', currentUser.id)
                    .single();
                
                await supabaseClient
                    .from('wallets')
                    .update({ balance: wallet.balance + profit })
                    .eq('id', currentUser.id);
            }

            await fetchBalance();
            await loadTrades();
            showToast(won ? `Trade WON! +$${profit.toFixed(2)}` : `Trade LOST! -$${amount}`, won ? 'success' : 'error');
        }

        async function loadTrades() {
            const { data } = await supabaseClient
                .from('trades')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false })
                .limit(10);

            const tbody = document.getElementById('tradesTable');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">No trades yet</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(trade => `
                <tr class="hover:bg-slate-800/50">
                    <td class="px-6 py-4 text-sm">${new Date(trade.created_at).toLocaleString()}</td>
                    <td class="px-6 py-4 text-sm">${trade.asset}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded text-xs font-bold ${trade.direction === 'UP' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                            ${trade.direction}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm">$${parseFloat(trade.amount).toFixed(2)}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded text-xs font-bold ${
                            trade.status === 'won' ? 'bg-green-500/20 text-green-400' : 
                            trade.status === 'lost' ? 'bg-red-500/20 text-red-400' : 
                            'bg-yellow-500/20 text-yellow-400'
                        }">
                            ${trade.status.toUpperCase()}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm font-bold ${
                        trade.profit > 0 ? 'text-green-400' : trade.profit < 0 ? 'text-red-400' : 'text-slate-400'
                    }">
                        ${trade.profit ? (trade.profit > 0 ? '+' : '') + '$' + parseFloat(trade.profit).toFixed(2) : '-'}
                    </td>
                </tr>
            `).join('');
        }

        function changeAmount(val) {
            const input = document.getElementById('tradeAmount');
            let current = parseInt(input.value) || 0;
            current += val;
            if (current < 1) current = 1;
            input.value = current;
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-5 right-5 px-6 py-3 rounded-lg shadow-lg text-white font-semibold z-[200] ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            }`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-btn').forEach(b => {
                    b.className = 'time-btn bg-slate-800 border border-slate-700 py-2 rounded-lg text-white text-sm';
                });
                btn.className = 'time-btn bg-green-500/20 border border-green-500 py-2 rounded-lg text-green-400 font-bold text-sm';
                selectedTime = parseInt(btn.dataset.time);
            });
        });

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        checkAuth();
    </script>
</body>
</html>
