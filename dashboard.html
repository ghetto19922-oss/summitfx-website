<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - SummitFX Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0a0f1a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .dropdown-menu { display: none; }
        .dropdown-menu.show { display: block; }
        input, select, textarea { font-size: 16px; }
        html { scroll-behavior: smooth; }
        
        /* Ensure TradingView widget fills its container perfectly */
        .tradingview-widget-container__widget {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col pb-24">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center sticky top-0 z-40">
        <a href="index.html" class="flex items-center gap-2">
            <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center font-bold text-slate-900 text-sm">S</div>
            <span class="text-lg font-bold hidden sm:inline">Summit<span class="text-green-400">FX</span></span>
        </a>
        
        <div class="flex items-center gap-3">
            <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                <span class="text-slate-400 text-xs">Balance:</span>
                <span id="userBalance" class="text-white font-bold ml-1 text-sm">$0.00</span>
            </div>
            
            <!-- Dropdown Menu -->
            <div class="relative">
                <button onclick="toggleDropdown()" class="flex items-center gap-1 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition active:scale-95">
                    <div class="w-7 h-7 bg-green-500 rounded-full flex items-center justify-center text-slate-900 font-bold text-sm">
                        <span id="userInitial">U</span>
                    </div>
                    <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                
                <div id="dropdownMenu" class="dropdown-menu absolute right-0 mt-2 w-64 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50 max-h-[70vh] overflow-y-auto">
                    <div class="px-4 py-3 border-b border-slate-700">
                        <p class="text-xs text-slate-400">Signed in as</p>
                        <p id="userEmail" class="text-sm font-medium text-white truncate">user@example.com</p>
                    </div>
                    <div class="py-2">
                        <a href="profile.html" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-700 active:bg-slate-600">👤 Profile</a>
                        <a href="#" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-700 active:bg-slate-600">🤖 Trading Bots</a>
                        <a href="#" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-700 active:bg-slate-600">📊 Investment Plans</a>
                        <a href="deposit.html" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-700 active:bg-slate-600">💵 Deposit</a>
                        <a href="withdraw.html" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-700 active:bg-slate-600">💸 Withdraw</a>
                        <a href="#" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-700 active:bg-slate-600">📄 Transactions</a>
                    </div>
                    <div class="border-t border-slate-700 py-2">
                        <button onclick="handleLogout()" class="w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-slate-700 active:bg-slate-600"> Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col p-3 gap-3 max-w-[1600px] mx-auto w-full">
        
        <!-- Chart - Fully Interactive & Responsive -->
        <div class="w-full bg-slate-900 rounded-xl border border-slate-800 overflow-hidden" style="height: 50vh; min-height: 350px;">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                    "autosize": true,
                    "symbol": "BINANCE:BTCUSDT",
                    "interval": "1",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "enable_publishing": false,
                    "allow_symbol_change": true,
                    "hide_side_toolbar": false,
                    "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies"]
                }
                </script>
            </div>
        </div>

        <!-- Trade Panel -->
        <div class="w-full bg-slate-900 rounded-xl border border-slate-800 p-4 flex flex-col gap-4">
            <h3 class="text-lg font-bold text-center">Place Trade</h3>
            
            <!-- Asset -->
            <div>
                <label class="text-xs text-slate-400 uppercase font-semibold">Asset</label>
                <div class="mt-2 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white font-semibold flex justify-between items-center">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> BTC/USDT
                    </span>
                    <span class="text-green-400 text-sm font-bold bg-green-500/10 px-2 py-1 rounded">85% Payout</span>
                </div>
            </div>

            <!-- Time -->
            <div>
                <label class="text-xs text-slate-400 uppercase font-semibold">Expiration Time</label>
                <div class="mt-2 grid grid-cols-3 gap-3">
                    <button class="time-btn bg-slate-800 border-2 border-slate-700 py-3 rounded-xl text-white font-semibold text-base active:scale-95 transition" data-time="60">1 Min</button>
                    <button class="time-btn bg-green-500/20 border-2 border-green-500 py-3 rounded-xl text-green-400 font-bold text-base active:scale-95 transition" data-time="300">5 Min</button>
                    <button class="time-btn bg-slate-800 border-2 border-slate-700 py-3 rounded-xl text-white font-semibold text-base active:scale-95 transition" data-time="900">15 Min</button>
                </div>
            </div>

            <!-- Amount -->
            <div>
                <label class="text-xs text-slate-400 uppercase font-semibold">Trade Amount ($)</label>
                <div class="mt-2 flex items-center bg-slate-800 border-2 border-slate-700 rounded-xl overflow-hidden">
                    <button onclick="changeAmount(-10)" class="px-5 py-4 text-white hover:bg-slate-700 active:bg-slate-600 text-2xl font-bold transition w-16">−</button>
                    <input type="number" id="tradeAmount" value="100" class="flex-1 bg-transparent text-center text-white font-bold text-2xl focus:outline-none border-x-2 border-slate-700 py-4">
                    <button onclick="changeAmount(10)" class="px-5 py-4 text-white hover:bg-slate-700 active:bg-slate-600 text-2xl font-bold transition w-16">+</button>
                </div>
                <div class="mt-2 flex gap-2">
                    <button onclick="setAmount(10)" class="flex-1 bg-slate-800 py-2 rounded-lg text-xs text-slate-300 active:bg-slate-700">$10</button>
                    <button onclick="setAmount(50)" class="flex-1 bg-slate-800 py-2 rounded-lg text-xs text-slate-300 active:bg-slate-700">$50</button>
                    <button onclick="setAmount(100)" class="flex-1 bg-slate-800 py-2 rounded-lg text-xs text-slate-300 active:bg-slate-700">$100</button>
                    <button onclick="setAmount(500)" class="flex-1 bg-slate-800 py-2 rounded-lg text-xs text-slate-300 active:bg-slate-700">$500</button>
                </div>
            </div>

            <!-- BUY / SELL Buttons -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="executeTrade('BUY')" class="py-5 bg-gradient-to-b from-green-500 to-green-600 hover:from-green-400 hover:to-green-500 active:scale-95 text-white font-bold text-xl rounded-xl shadow-lg shadow-green-500/30 transition flex flex-col items-center justify-center">
                    <span class="text-3xl mb-1">▲</span>
                    <span>BUY</span>
                </button>
                <button onclick="executeTrade('SELL')" class="py-5 bg-gradient-to-b from-red-500 to-red-600 hover:from-red-400 hover:to-red-500 active:scale-95 text-white font-bold text-xl rounded-xl shadow-lg shadow-red-500/30 transition flex flex-col items-center justify-center">
                    <span class="text-3xl mb-1">▼</span>
                    <span>SELL</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Trade History -->
    <section class="max-w-[1600px] mx-auto w-full px-4 pb-6">
        <h3 class="text-lg font-bold mb-3 px-1">Recent Trades</h3>
        <div class="bg-slate-900 rounded-xl border border-slate-800 overflow-x-auto">
            <table class="w-full text-left min-w-[600px]">
                <thead class="bg-slate-800 text-slate-400 text-xs uppercase">
                    <tr>
                        <th class="px-4 py-3">Time</th>
                        <th class="px-4 py-3">Asset</th>
                        <th class="px-4 py-3">Type</th>
                        <th class="px-4 py-3">Amount</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3">P/L</th>
                    </tr>
                </thead>
                <tbody id="tradesTable" class="divide-y divide-slate-800 text-sm">
                    <tr>
                        <td colspan="6" class="px-4 py-6 text-center text-slate-500">Loading trades...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 px-4 py-2 flex justify-around items-center z-40 md:hidden">
        <a href="dashboard.html" class="flex flex-col items-center gap-1 text-green-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
            <span class="text-[10px]">Trade</span>
        </a>
        <a href="deposit.html" class="flex flex-col items-center gap-1 text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[10px]">Wallet</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            <span class="text-[10px]">Stats</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center gap-1 text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px]">Profile</span>
        </a>
    </nav>

    <script>
        const SUPABASE_URL = 'https://lrfufnpfehdizzwvausy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyZnVmbnBmZWhkaXp6d3ZhdXN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MDAzNzksImV4cCI6MjA5ODM3NjM3OX0.UafAmnWeqkvWZQSGfQYnjYLkbtROVKj9yhLR4wPG5mI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let selectedTime = 300;

        function toggleDropdown() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('button[onclick="toggleDropdown()"]')) {
                const dropdowns = document.getElementsByClassName('dropdown-menu');
                for (let dropdown of dropdowns) {
                    if (dropdown.classList.contains('show')) {
                        dropdown.classList.remove('show');
                    }
                }
            }
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'signin.html';
            } else {
                currentUser = session.user;
                document.getElementById('userEmail').textContent = currentUser.email;
                document.getElementById('userInitial').textContent = currentUser.email.charAt(0).toUpperCase();
                await fetchBalance();
                await loadTrades();
            }
        }

        async function fetchBalance() {
            const { data } = await supabaseClient
                .from('wallets')
                .select('balance')
                .eq('id', currentUser.id)
                .single();
            
            if (data) {
                document.getElementById('userBalance').textContent = 
                    `$${parseFloat(data.balance).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            }
        }

        async function executeTrade(direction) {
            const amount = parseFloat(document.getElementById('tradeAmount').value);
            
            const { data: wallet } = await supabaseClient
                .from('wallets')
                .select('balance')
                .eq('id', currentUser.id)
                .single();

            if (amount > wallet.balance) {
                showToast('Insufficient balance!', 'error');
                return;
            }

            // Simulated entry price (in a real app, fetch from API)
            const entryPrice = 65000.00; 

            const newBalance = wallet.balance - amount;
            await supabaseClient
                .from('wallets')
                .update({ balance: newBalance })
                .eq('id', currentUser.id);

            const { error } = await supabaseClient
                .from('trades')
                .insert({
                    user_id: currentUser.id,
                    asset: 'BTC/USDT',
                    amount: amount,
                    direction: direction, // 'BUY' or 'SELL'
                    entry_price: entryPrice,
                    duration_seconds: selectedTime,
                    payout_percentage: 85.00,
                    status: 'pending'
                });

            if (error) {
                showToast('Error placing trade', 'error');
                return;
            }

            showToast(`Trade placed: ${direction} $${amount}`, 'success');
            await fetchBalance();
            await loadTrades();

            // Simulate trade completion after selected time
            setTimeout(() => completeTrade(direction, amount, entryPrice), selectedTime * 1000);
        }

        async function completeTrade(direction, amount, entryPrice) {
            // Simulate price movement
            const priceChange = (Math.random() - 0.5) * 100; // Random movement
            const exitPrice = entryPrice + priceChange;
            
            let won = false;
            // BUY wins if price goes UP, SELL wins if price goes DOWN
            if (direction === 'BUY' && exitPrice > entryPrice) won = true;
            if (direction === 'SELL' && exitPrice < entryPrice) won = true;

            const profit = won ? amount * 0.85 : -amount;
            const status = won ? 'won' : 'lost';

            await supabaseClient
                .from('trades')
                .update({
                    exit_price: exitPrice,
                    status: status,
                    profit: profit,
                    completed_at: new Date().toISOString()
                })
                .eq('user_id', currentUser.id)
                .eq('status', 'pending')
                .order('created_at', { ascending: false })
                .limit(1);

            if (won) {
                const { data: wallet } = await supabaseClient
                    .from('wallets')
                    .select('balance')
                    .eq('id', currentUser.id)
                    .single();
                
                await supabaseClient
                    .from('wallets')
                    .update({ balance: wallet.balance + profit })
                    .eq('id', currentUser.id);
            }

            await fetchBalance();
            await loadTrades();
            showToast(won ? `Trade WON! +$${profit.toFixed(2)}` : `Trade LOST! -$${amount}`, won ? 'success' : 'error');
        }

        async function loadTrades() {
            const { data } = await supabaseClient
                .from('trades')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false })
                .limit(10);

            const tbody = document.getElementById('tradesTable');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-6 text-center text-slate-500">No trades yet</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(trade => `
                <tr class="hover:bg-slate-800/50">
                    <td class="px-4 py-3 text-xs">${new Date(trade.created_at).toLocaleTimeString()}</td>
                    <td class="px-4 py-3 text-xs">${trade.asset}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded text-xs font-bold ${trade.direction === 'BUY' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                            ${trade.direction}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-xs">$${parseFloat(trade.amount).toFixed(2)}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded text-xs font-bold ${
                            trade.status === 'won' ? 'bg-green-500/20 text-green-400' : 
                            trade.status === 'lost' ? 'bg-red-500/20 text-red-400' : 
                            'bg-yellow-500/20 text-yellow-400'
                        }">
                            ${trade.status.toUpperCase()}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-xs font-bold ${
                        trade.profit > 0 ? 'text-green-400' : trade.profit < 0 ? 'text-red-400' : 'text-slate-400'
                    }">
                        ${trade.profit ? (trade.profit > 0 ? '+' : '') + '$' + parseFloat(trade.profit).toFixed(2) : '-'}
                    </td>
                </tr>
            `).join('');
        }

        function changeAmount(val) {
            const input = document.getElementById('tradeAmount');
            let current = parseInt(input.value) || 0;
            current += val;
            if (current < 1) current = 1;
            input.value = current;
        }

        function setAmount(val) {
            document.getElementById('tradeAmount').value = val;
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-24 left-4 right-4 px-6 py-4 rounded-xl shadow-2xl text-white font-semibold z-[200] text-center ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            }`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-btn').forEach(b => {
                    b.className = 'time-btn bg-slate-800 border-2 border-slate-700 py-3 rounded-xl text-white font-semibold text-base active:scale-95 transition';
                });
                btn.className = 'time-btn bg-green-500/20 border-2 border-green-500 py-3 rounded-xl text-green-400 font-bold text-base active:scale-95 transition';
                selectedTime = parseInt(btn.dataset.time);
            });
        });

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        checkAuth();
    </script>
</body>
</html>
