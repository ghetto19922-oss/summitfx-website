<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SummitFX Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0a0f1a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .tab-active {
            color: #22c55e;
            border-bottom: 2px solid #22c55e;
        }
        .tab-inactive {
            color: #94a3b8;
            border-bottom: 2px solid transparent;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Background blur effect -->
    <div class="fixed inset-0 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 -z-10"></div>

    <!-- Sign Up Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
        
        <!-- Close Button -->
        <a href="index.html" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl z-10">&times;</a>

        <!-- Header -->
        <div class="px-8 pt-8 pb-4 text-center">
            <h1 class="text-3xl font-bold mb-2">Create Account</h1>
            <p class="text-slate-400 text-sm">Join SummitFX</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-slate-800 px-8">
            <a href="signin.html" class="flex-1 pb-3 text-lg font-medium tab-inactive transition text-center">
                Login
            </a>
            <div class="flex-1 pb-3 text-lg font-medium tab-active transition text-center">
                Register
            </div>
        </div>

        <!-- Form -->
        <div class="p-8">
            <form id="signupForm" class="space-y-5">
                
                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">USERNAME</label>
                    <input type="text" id="username" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-green-500 transition" placeholder="Username">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">EMAIL</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-green-500 transition" placeholder="Email">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">PASSWORD</label>
                    <input type="password" id="password" required minlength="6" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-green-500 transition" placeholder="••••••••">
                </div>

                <!-- Referral Code -->
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">REFERRAL CODE <span class="text-slate-600">(optional)</span></label>
                    <input type="text" id="referralCode" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-green-500 transition" placeholder="e.g. AB12CD34">
                </div>

                <!-- Message -->
                <div id="message" class="hidden text-sm text-center p-3 rounded-lg"></div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full py-4 bg-green-500 hover:bg-green-600 text-white font-bold text-lg rounded-xl transition shadow-lg shadow-green-500/20">
                    Sign Up
                </button>
            </form>

            <!-- Sign In Link -->
            <p class="text-center text-slate-400 text-sm mt-6">
                Already have an account? <a href="signin.html" class="text-green-500 hover:text-green-400 font-semibold">Sign in</a>
            </p>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const SUPABASE_URL = 'https://lrfufnpfehdizzwvausy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyZnVmbnBmZWhkaXp6d3ZhdXN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MDAzNzksImV4cCI6MjA5ODM3NjM3OX0.UafAmnWeqkvWZQSGfQYnjYLkbtROVKj9yhLR4wPG5mI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const referralCode = document.getElementById('referralCode').value;
            const submitBtn = document.getElementById('submitBtn');
            const message = document.getElementById('message');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            username: username,
                            referral_code: referralCode
                        }
                    }
                });

                if (error) throw error;

                message.textContent = 'Account created! Redirecting to sign in...';
                message.className = 'text-sm text-center p-3 rounded-lg bg-emerald-500/20 text-emerald-300';
                message.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'signin.html';
                }, 2000);

            } catch (error) {
                message.textContent = error.message;
                message.className = 'text-sm text-center p-3 rounded-lg bg-red-500/20 text-red-300';
                message.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign Up';
            }
        });
    </script>

</body>
</html>
