<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SummitFX Trading Corporation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); }
        .tab-active { color: #22c55e; border-bottom: 2px solid #22c55e; }
        .tab-inactive { color: #94a3b8; border-bottom: 2px solid transparent; }
    </style>
</head>
<body class="antialiased">

    <!-- ============================================ -->
    <!-- HOMEPAGE (Visible when logged OUT)           -->
    <!-- ============================================ -->
    <div id="homepage">
        <!-- Navigation Bar -->
        <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center font-bold text-slate-900">S</div>
                        <span class="text-xl font-bold tracking-tight">Summit<span class="text-green-400">FX</span></span>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="openModal('login')" class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white transition">Log In</button>
                        <button onclick="openModal('register')" class="px-4 py-2 text-sm font-medium bg-green-500 hover:bg-green-600 text-white rounded-lg transition shadow-lg shadow-green-500/20">Sign Up</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 pb-20 text-center">
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6">
                Trade Smarter with <br><span class="gradient-text">SummitFX Corporation</span>
            </h1>
            <p class="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto mb-10">
                Experience next-generation automated options trading. Lightning-fast execution, secure deposits, and professional-grade tools.
            </p>
            <button onclick="openModal('register')" class="px-8 py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-lg transition shadow-lg shadow-green-500/20">
                Start Trading Now
            </button>
        </main>
    </div>

    <!-- ============================================ -->
    <!-- TRADING DASHBOARD (Visible when logged IN)   -->
    <!-- ============================================ -->
    <div id="dashboard" class="hidden min-h-screen bg-slate-950 flex flex-col">
        <!-- Dashboard Header -->
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center font-bold text-slate-900">S</div>
                <span class="text-xl font-bold hidden sm:block">Summit<span class="text-green-400">FX</span></span>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                    <span class="text-slate-400 text-sm">Balance:</span>
                    <span id="userBalance" class="text-white font-bold ml-2">$0.00</span>
                </div>
                <button onclick="handleLogout()" class="text-slate-400 hover:text-red-400 transition font-medium">Logout</button>
            </div>
        </header>

        <!-- Dashboard Main Content -->
        <main class="flex-1 flex flex-col lg:flex-row p-4 gap-4 overflow-hidden">
            <!-- Chart Area -->
            <div class="flex-1 bg-slate-900 rounded-xl border border-slate-800 p-2 min-h-[500px]">
                <div class="tradingview-widget-container" style="height:100%;width:100%">
                    <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                    {
                        "autosize": true,
                        "symbol": "BINANCE:BTCUSDT",
                        "interval": "1",
                        "timezone": "Etc/UTC",
                        "theme": "dark",
                        "style": "1",
                        "locale": "en",
                        "enable_publishing": false,
                        "allow_symbol_change": true,
                        "support_host": "https://www.tradingview.com"
                    }
                    </script>
                </div>
            </div>

            <!-- Trade Control Panel -->
            <div class="w-full lg:w-80 bg-slate-900 rounded-xl border border-slate-800 p-6 flex flex-col gap-5">
                <h3 class="text-xl font-bold text-center">Quick Trade</h3>
                
                <!-- Asset -->
                <div>
                    <label class="text-xs text-slate-400 uppercase font-semibold">Asset</label>
                    <div class="mt-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white font-semibold flex justify-between">
                        <span>EUR/USD</span>
                        <span class="text-green-400 text-sm">Payout 85%</span>
                    </div>
                </div>

                <!-- Time -->
                <div>
                    <label class="text-xs text-slate-400 uppercase font-semibold">Expiration Time</label>
                    <div class="mt-1 grid grid-cols-3 gap-2">
                        <button class="time-btn bg-slate-800 border border-slate-700 py-2 rounded-lg text-white hover:border-green-500 transition" data-time="60">1m</button>
                        <button class="time-btn bg-green-500/20 border border-green-500 py-2 rounded-lg text-green-400 font-bold" data-time="300">5m</button>
                        <button class="time-btn bg-slate-800 border border-slate-700 py-2 rounded-lg text-white hover:border-green-500 transition" data-time="900">15m</button>
                    </div>
                </div>

                <!-- Amount -->
                <div>
                    <label class="text-xs text-slate-400 uppercase font-semibold">Trade Amount ($)</label>
                    <div class="mt-1 flex items-center bg-slate-800 border border-slate-700 rounded-lg overflow-hidden">
                        <button onclick="changeAmount(-10)" class="px-4 py-3 text-white hover:bg-slate-700 text-xl font-bold transition">-</button>
                        <input type="number" id="tradeAmount" value="100" class="flex-1 bg-transparent text-center text-white font-bold text-lg focus:outline-none">
                        <button onclick="changeAmount(10)" class="px-4 py-3 text-white hover:bg-slate-700 text-xl font-bold transition">+</button>
                    </div>
                </div>

                <!-- Trade Buttons -->
                <div class="mt-auto grid grid-cols-2 gap-3 pt-4">
                    <button onclick="executeTrade('UP')" class="py-4 bg-green-500 hover:bg-green-600 text-white font-bold text-lg rounded-xl shadow-lg shadow-green-500/20 transition">
                        ▲ UP
                    </button>
                    <button onclick="executeTrade('DOWN')" class="py-4 bg-red-500 hover:bg-red-600 text-white font-bold text-lg rounded-xl shadow-lg shadow-red-500/20 transition">
                        ▼ DOWN
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- ============================================ -->
    <!-- AUTHENTICATION MODAL                         -->
    <!-- ============================================ -->
    <div id="authModal" class="fixed inset-0 modal-overlay hidden items-center justify-center z-[100] p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl z-10">&times;</button>
            <div class="px-8 pt-8 pb-4">
                <h2 class="text-3xl font-bold text-center mb-2">Create Account</h2>
                <p class="text-slate-400 text-center text-sm">Join SummitFX</p>
            </div>
            <div class="flex border-b border-slate-700 px-8">
                <button onclick="switchTab('login')" id="loginTab" class="flex-1 pb-3 text-lg font-medium tab-inactive transition">Login</button>
                <button onclick="switchTab('register')" id="registerTab" class="flex-1 pb-3 text-lg font-medium tab-active transition">Register</button>
            </div>
            <div class="p-8">
                <form id="authForm" class="space-y-5">
                    <div id="usernameField">
                        <label class="block text-sm font-medium text-slate-400 mb-2">USERNAME</label>
                        <input type="text" id="username" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-green-500 transition" placeholder="Username">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">EMAIL</label>
                        <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-green-500 transition" placeholder="Email">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">PASSWORD</label>
                        <input type="password" id="password" required minlength="6" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-green-500 transition" placeholder="••••••••">
                    </div>
                    <div id="referralField">
                        <label class="block text-sm font-medium text-slate-400 mb-2">REFERRAL CODE <span class="text-slate-600">(optional)</span></label>
                        <input type="text" id="referralCode" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-green-500 transition" placeholder="e.g. AB12CD34">
                    </div>
                    <div id="authMessage" class="hidden text-sm text-center p-3 rounded-lg"></div>
                    <button type="submit" id="submitBtn" class="w-full py-4 bg-green-500 hover:bg-green-600 text-white font-bold text-lg rounded-xl transition shadow-lg shadow-green-500/20">Sign Up</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- JAVASCRIPT: All Logic                        -->
    <!-- ============================================ -->
    <script>
        // 1. SUPABASE INITIALIZATION
        const SUPABASE_URL = 'https://lrfufnpfehdizzwvausy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyZnVmbnBmZWhkaXp6d3ZhdXN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MDAzNzksImV4cCI6MjA5ODM3NjM3OX0.UafAmnWeqkvWZQSGfQYnjYLkbtROVKj9yhLR4wPG5mI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. APP STATE & ROUTING
        async function initializeApp() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showDashboard(session.user);
            } else {
                showHomepage();
            }
        }

        // Listen for login/logout events
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session) {
                showDashboard(session.user);
            } else if (event === 'SIGNED_OUT') {
                showHomepage();
            }
        });

        function showDashboard(user) {
            document.getElementById('homepage').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            closeModal();
            fetchBalance(user.id);
            // Force TradingView chart to resize properly
            setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
        }

        function showHomepage() {
            document.getElementById('homepage').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            closeModal();
        }

        async function fetchBalance(userId) {
            const { data, error } = await supabaseClient
                .from('wallets')
                .select('balance')
                .eq('id', userId)
                .single();

            if (data) {
                const formatted = parseFloat(data.balance).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                document.getElementById('userBalance').textContent = `$${formatted}`;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
        }

        // 3. TRADING LOGIC
        function changeAmount(val) {
            const input = document.getElementById('tradeAmount');
            let current = parseInt(input.value) || 0;
            current += val;
            if (current < 1) current = 1;
            input.value = current;
        }

        function executeTrade(direction) {
            const amount = parseFloat(document.getElementById('tradeAmount').value);
            const balanceText = document.getElementById('userBalance').textContent.replace('$', '').replace(/,/g, '');
            const balance = parseFloat(balanceText);

            if (amount > balance) {
                showToast('Insufficient balance!', 'error');
                return;
            }
            
            showToast(`Trade Executed: ${direction} for $${amount}!`, 'success');
        }

        // 4. TOAST NOTIFICATIONS
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-5 right-5 px-6 py-3 rounded-lg shadow-lg text-white font-semibold z-[200] transition-all transform translate-y-10 opacity-0 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // 5. AUTH MODAL LOGIC
        let currentMode = 'register';

        function openModal(mode) {
            currentMode = mode;
            updateModalUI();
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('authModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('authModal').classList.remove('flex');
            document.getElementById('authForm').reset();
            document.getElementById('authMessage').classList.add('hidden');
        }

        function switchTab(mode) {
            currentMode = mode;
            updateModalUI();
            document.getElementById('authMessage').classList.add('hidden');
        }

        function updateModalUI() {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const usernameField = document.getElementById('usernameField');
            const referralField = document.getElementById('referralField');
            const submitBtn = document.getElementById('submitBtn');

            if (currentMode === 'login') {
                loginTab.className = 'flex-1 pb-3 text-lg font-medium tab-active transition';
                registerTab.className = 'flex-1 pb-3 text-lg font-medium tab-inactive transition';
                usernameField.classList.add('hidden');
                referralField.classList.add('hidden');
                submitBtn.textContent = 'Sign In';
            } else {
                registerTab.className = 'flex-1 pb-3 text-lg font-medium tab-active transition';
                loginTab.className = 'flex-1 pb-3 text-lg font-medium tab-inactive transition';
                usernameField.classList.remove('hidden');
                referralField.classList.remove('hidden');
                submitBtn.textContent = 'Sign Up';
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('authMessage');
            msg.textContent = text;
            msg.classList.remove('hidden', 'bg-red-500/20', 'text-red-300', 'bg-emerald-500/20', 'text-emerald-300');
            if (type === 'error') msg.classList.add('bg-red-500/20', 'text-red-300');
            else msg.classList.add('bg-emerald-500/20', 'text-emerald-300');
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value;
            const referralCode = document.getElementById('referralCode').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            try {
                if (currentMode === 'register') {
                    const { error } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: { data: { username: username, referral_code: referralCode } }
                    });
                    if (error) throw error;
                    showMessage('Account created! Logging you in...', 'success');
                } else {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
                    if (error) throw error;
                    showMessage('Login successful!', 'success');
                }
            } catch (error) {
                showMessage(error.message, 'error');
                submitBtn.disabled = false;
                updateModalUI();
            }
        });

        document.getElementById('authModal').addEventListener('click', (e) => {
            if (e.target.id === 'authModal') closeModal();
        });

        // Time buttons selection
        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-btn').forEach(b => {
                    b.className = 'time-btn bg-slate-800 border border-slate-700 py-2 rounded-lg text-white hover:border-green-500 transition';
                });
                btn.className = 'time-btn bg-green-500/20 border border-green-500 py-2 rounded-lg text-green-400 font-bold';
            });
        });

        // START THE APP
        initializeApp();
    </script>
</body>
</html>
